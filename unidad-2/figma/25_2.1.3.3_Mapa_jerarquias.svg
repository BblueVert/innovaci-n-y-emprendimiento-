<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="3173" viewBox="0 0 3000 3173"><title>25_2.1.3.3_Mapa_jerarquias</title><rect width="3000" height="3173" fill="#F7F6FB"/><text x="140" y="174" font-family="DM Mono" font-size="34" font-weight="400" fill="#FF6B35" letter-spacing="2.72" text-anchor="start"><tspan x="140" dy="0">TÉCNICA · CATEGORIZACIÓN Y JERARQUIZACIÓN</tspan></text><text x="140" y="340" font-family="Bebas Neue" font-size="150" font-weight="400" fill="#14142B" text-anchor="start"><tspan x="140" dy="0">INSTRUMENTO 2.1.3.3 — MAPA DE JERARQUÍAS</tspan></text><text x="140" y="430" font-family="Plus Jakarta Sans" font-size="38" font-weight="400" fill="#8A8799" text-anchor="start"><tspan x="140" dy="0">Definir la variable de cada eje, ubicar necesidades y requerimientos ya categorizados y consensuar su posición. Un color para necesidades</tspan><tspan x="140" dy="51.300000000000004">y otro para requerimientos.</tspan></text><rect id="Eje 1 (horizontal) · variable" x="140" y="572.6" width="1340" height="200" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="188" y="650.6" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="188" dy="0">EJE 1 (HORIZONTAL) · VARIABLE</tspan></text><text x="188" y="712.6" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="188" dy="0">Ej: impacto en la usuaria</tspan></text><rect id="Eje 2 (vertical) · variable" x="1520" y="572.6" width="1340" height="200" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="1568" y="650.6" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="1568" dy="0">EJE 2 (VERTICAL) · VARIABLE</tspan></text><text x="1568" y="712.6" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="1568" dy="0">Ej: urgencia o frecuencia del dolor</tspan></text><rect x="140" y="812.6" width="380" height="90" rx="45" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><rect x="164" y="837.6" width="40" height="40" rx="6" fill="#D9D2FF"/><text x="224" y="869.6" font-family="Plus Jakarta Sans" font-size="32" font-weight="500" fill="#14142B" text-anchor="start"><tspan x="224" dy="0">Necesidad</tspan></text><rect x="560" y="812.6" width="380" height="90" rx="45" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><rect x="584" y="837.6" width="40" height="40" rx="6" fill="#FFD6C2"/><text x="644" y="869.6" font-family="Plus Jakarta Sans" font-size="32" font-weight="500" fill="#14142B" text-anchor="start"><tspan x="644" dy="0">Requerimiento</tspan></text><text x="1020" y="869.6" font-family="Plus Jakarta Sans" font-size="30" font-weight="400" fill="#8A8799" text-anchor="start"><tspan x="1020" dy="0">Usa post-its de dos colores y suéltalos libremente en el plano.</tspan></text><rect id="Plano" x="140" y="942.6" width="2720" height="1900" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><rect x="300" y="1889.6" width="2400" height="6" rx="0" fill="#1B1F3B"/><rect x="1497" y="1062.6" width="6" height="1660" rx="0" fill="#1B1F3B"/><text x="2680" y="1952.6" font-family="DM Mono" font-size="32" font-weight="400" fill="#14142B" letter-spacing="2.56" text-anchor="end"><tspan x="2680" dy="0">EJE 1 (+) →</tspan></text><text x="310" y="1952.6" font-family="DM Mono" font-size="32" font-weight="400" fill="#14142B" letter-spacing="2.56" text-anchor="start"><tspan x="310" dy="0">(−)</tspan></text><text x="1524" y="1112.6" font-family="DM Mono" font-size="32" font-weight="400" fill="#14142B" letter-spacing="2.56" text-anchor="start"><tspan x="1524" dy="0">↑ EJE 2 (+)</tspan></text><text x="1524" y="2702.6" font-family="DM Mono" font-size="32" font-weight="400" fill="#14142B" letter-spacing="2.56" text-anchor="start"><tspan x="1524" dy="0">(−)</tspan></text><text x="2660" y="