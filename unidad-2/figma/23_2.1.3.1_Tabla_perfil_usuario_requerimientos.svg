<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="4556" viewBox="0 0 3000 4556"><title>23_2.1.3.1_Tabla_perfil_usuario_requerimientos</title><rect width="3000" height="4556" fill="#F7F6FB"/><text x="140" y="174" font-family="DM Mono" font-size="34" font-weight="400" fill="#FF6B35" letter-spacing="2.72" text-anchor="start"><tspan x="140" dy="0">TÉCNICA · PERFIL DE USUARIO Y ESTUDIO DE REQUERIMIENTOS</tspan></text><text x="140" y="340" font-family="Bebas Neue" font-size="150" font-weight="400" fill="#14142B" text-anchor="start"><tspan x="140" dy="0">INSTRUMENTO 2.1.3.1 — TABLA CON PERFIL DE</tspan><tspan x="140" dy="142.5">USUARIO Y REQUERIMIENTOS</tspan></text><text x="140" y="572.5" font-family="Plus Jakarta Sans" font-size="38" font-weight="400" fill="#8A8799" text-anchor="start"><tspan x="140" dy="0">Primero el desafío, luego el perfil (mapa de empatía) y al final cada insight con los requerimientos que debe considerar la solución.</tspan></text><rect id="Desafío" x="140" y="663.8" width="2720" height="130" rx="20" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="180" y="739.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="180" dy="0">DESAFÍO</tspan></text><text x="400" y="741.8" font-family="Plus Jakarta Sans" font-size="36" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="400" dy="0">Pega aquí el desafío redefinido en la UA1</tspan></text><rect x="140" y="873.8" width="10" height="64" rx="0" fill="#FF6B35"/><text x="174" y="921.8" font-family="Plus Jakarta Sans" font-size="52" font-weight="600" fill="#14142B" text-anchor="start"><tspan x="174" dy="0">Perfil de usuario</tspan></text><rect id="Usuario" x="140" y="977.8" width="2720" height="130" rx="20" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="180" y="1053.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="180" dy="0">USUARIO</tspan></text><text x="400" y="1055.8" font-family="Plus Jakarta Sans" font-size="36" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="400" dy="0">¿Quién es? Nombre, rol y contexto</tspan></text><rect id="¿Qué piensa y qué siente?" x="140" y="1147.8" width="885.3333333333334" height="520" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="188" y="1225.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="188" dy="0">¿QUÉ PIENSA Y QUÉ SIENTE?</tspan></text><text x="188" y="1287.8" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="188" dy="0">Lo que realmente le interesa aunque no lo diga;</tspan><tspan x="188" dy="43.2">preocupaciones e inquietudes.</tspan></text><rect id="¿Qué ve?" x="1057.3333333333335" y="1147.8" width="885.3333333333334" height="520" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="1105.3333333333335" y="1225.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="1105.3333333333335" dy="0">¿QUÉ VE?</tspan></text><text x="1105.3333333333335" y="1287.8" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="1105.3333333333335" dy="0">Quiénes la rodean y qué ofertas la rodean.</tspan></text><rect id="¿Qué oye?" x="1974.6666666666667" y="1147.8" width="885.3333333333334" height="520" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="2022.6666666666667" y="1225.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="2022.6666666666667" dy="0">¿QUÉ OYE?</tspan></text><text x="2022.6666666666667" y="1287.8" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="2022.6666666666667" dy="0">Lo que dicen quienes la rodean y las personas</tspan><tspan x="2022.6666666666667" dy="43.2">influyentes para ella.</tspan></text><rect id="¿Qué dice y qué hace?" x="140" y="1699.8" width="885.3333333333334" height="520" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="188" y="1777.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="188" dy="0">¿QUÉ DICE Y QUÉ HACE?</tspan></text><text x="188" y="1839.8" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="188" dy="0">Su actitud y lo que dice en público.</tspan></text><rect id="¿Qué le duele?" x="1057.3333333333335" y="1699.8" width="885.3333333333334" height="520" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="1105.3333333333335" y="1777.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="1105.3333333333335" dy="0">¿QUÉ LE DUELE?</tspan></text><text x="1105.3333333333335" y="1839.8" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="1105.3333333333335" dy="0">Principales frustraciones y obstáculos.</tspan></text><rect id="¿A qué aspira?" x="1974.6666666666667" y="1699.8" width="885.3333333333334" height="520" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="2022.6666666666667" y="1777.8" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="2022.6666666666667" dy="0">¿A QUÉ ASPIRA?</tspan></text><text x="2022.6666666666667" y="1839.8" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="2022.6666666666667" dy="0">Qué desea lograr, sus objetivos y cómo los</tspan><tspan x="2022.6666666666667" dy="43.2">logrará.</tspan></text><rect x="140" y="2291.8" width="10" height="64" rx="0" fill="#FF6B35"/><text x="174" y="2339.8" font-family="Plus Jakarta Sans" font-size="52" font-weight="600" fill="#14142B" text-anchor="start"><tspan x="174" dy="0">Insights y requerimientos</tspan></text><text x="140" y="2425.8" font-family="Plus Jakarta Sans" font-size="34" font-weight="400" fill="#8A8799" text-anchor="start"><tspan x="140" dy="0">Retomar la matriz de categorización de insights (UA1). Un insight por fila; a la derecha, los requerimientos que la solución debe cumplir.</tspan></text><rect id="Insight 1" x="140" y="2461.7000000000003" width="1260" height="230" rx="24" fill="#FFF1EA" stroke="#E4E2EE" stroke-width="3"/><text x="188" y="2539.7000000000003" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="188" dy="0">INSIGHT 1</tspan></text><text x="188" y="2601.7000000000003" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="188" dy="0">“Cita o hallazgo de la usuaria”</tspan></text><text x="1450" y="2601.7000000000003" font-family="Plus Jakarta Sans" font-size="72" font-weight="700" fill="#FF6B35" text-anchor="start"><tspan x="1450" dy="0">→</tspan></text><rect id="Requerimientos 1" x="1540" y="2461.7000000000003" width="1320" height="230" rx="24" fill="#FFFFFF" stroke="#E4E2EE" stroke-width="3"/><text x="1588" y="2539.7000000000003" font-family="DM Mono" font-size="30" font-weight="400" fill="#FF6B35" letter-spacing="2.4" text-anchor="start"><tspan x="1588" dy="0">REQUERIMIENTOS 1</tspan></text><text x="1588" y="2601.7000000000003" font-family="Plus Jakarta Sans" font-size="32" font-weight="400" font-style="italic" fill="#B9B6C8" text-anchor="start"><tspan x="1588" dy="0">· … · …</tspan></text><rect id="Insight 2" x="140" y="2715.7000000000003" width="1260" height="230" rx="